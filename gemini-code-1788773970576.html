<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposal Page</title>
    <style>
        body {
            background-color: #ffe6ea;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 320px;
            width: 90%;
        }
        img { 
            width: 120px; 
        }
        h2 { 
            color: #e91e63; 
            margin-top: 15px; 
        }
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            position: relative;
            min-height: 50px;
        }
        button {
            padding: 10px 25px;
            font-size: 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        #yesBtn { 
            background-color: #ff4081; 
            color: white; 
        }
        #noBtn { 
            background-color: #f1f1f1; 
            color: #333; 
            position: absolute;
            right: 20px;
        }
        .letter {
            display: none;
            background: #fff0f5;
            padding: 15px;
            border-radius: 10px;
            border: 1px dashed #ff4081;
            margin-top: 15px;
            font-size: 14px;
            color: #d81b60;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NxZmdkYmt3a2V2NXBsZzR2bWNzbWZ5ZXdwM3E2b2ZmdDlsNWdyNiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1d9Q8Z2pTO/giphy.gif" alt="Cute Gif">
        <h2>ခန့်ရဲ့အမျိုးသမီးလေးဖစ်ပေးနိုင်မလားထက်</h2>
        
        <div class="btn-container">
            <button id="yesBtn" onclick="acceptProposal()">Yes</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>

        <div class="letter" id="letterBox">
            <h3>💌 Confession Letter</h3>
            <p>ထက်ကို ခန့်အများကြီး ချစ်တယ်နော်။ ခန့်ဘေးနားမှာ အမြဲရှိပေးပါ။ ❤️</p>
        </div>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function acceptProposal() {
            document.getElementById('letterBox').style.display = 'block';
            document.getElementById('noBtn').style.display = 'none';
            document.querySelector('h2').innerText = "ထက်လည်းခန့်ကိုချစ်တာဝန်ခံတယ်နော်ခန့်";
        }
    </script>

</body>
</html>
